# MycoMonitor - Tierra Estella: generated by MycoMonitor's scripts/generate_dashboard.py (style: mushroom).
# Needs the Mushroom and ApexCharts cards from HACS.
title: MycoMonitor - Tierra Estella
views:
- title: Resumen
  path: resumen
  icon: mdi:mushroom
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Condiciones favorables
      icon: mdi:mushroom
    - type: markdown
      content: |
        {% set names = {'boletus_edulis': 'Boletus (grupo edulis)', 'calocybe_gambosa': 'Perretxiko (seta de San Jorge)', 'cantharellus_cibarius': 'Rebozuelo', 'craterellus_cornucopioides': 'Trompeta de los muertos', 'hydnum_repandum': 'Lengua de vaca', 'lactarius_deliciosus': 'Níscalo', 'lepista_nuda': 'Pie azul'} %}
        {% set factors = {'rain': 'Lluvia', 'water_balance': 'Balance hídrico', 'temperature': 'Temperatura', 'frost': 'Heladas', 'heat': 'Calor', 'wet_days': 'Días de lluvia', 'soil_warming': 'Calentamiento del suelo'} %}
        {% set best = state_attr('binary_sensor.mycomonitor_urbasa_favorable_conditions', 'best_species') %}
        **Urbasa**: {% if best %}Mejor especie: {{ names.get(best, best) }} ({{ state_attr('binary_sensor.mycomonitor_urbasa_favorable_conditions', 'best_index') | round(0) }}){% set lim = state_attr('sensor.mycomonitor_urbasa_' ~ best, 'limiting_factor') %}{% if lim %} · factor limitante: {{ factors.get(lim, lim) }}{% endif %}{% else %}—{% endif %}

        {% set best = state_attr('binary_sensor.mycomonitor_montejurra_favorable_conditions', 'best_species') %}
        **Montejurra**: {% if best %}Mejor especie: {{ names.get(best, best) }} ({{ state_attr('binary_sensor.mycomonitor_montejurra_favorable_conditions', 'best_index') | round(0) }}){% set lim = state_attr('sensor.mycomonitor_montejurra_' ~ best, 'limiting_factor') %}{% if lim %} · factor limitante: {{ factors.get(lim, lim) }}{% endif %}{% else %}—{% endif %}

        {% set best = state_attr('binary_sensor.mycomonitor_estella_lizarra_favorable_conditions', 'best_species') %}
        **Estella-Lizarra**: {% if best %}Mejor especie: {{ names.get(best, best) }} ({{ state_attr('binary_sensor.mycomonitor_estella_lizarra_favorable_conditions', 'best_index') | round(0) }}){% set lim = state_attr('sensor.mycomonitor_estella_lizarra_' ~ best, 'limiting_factor') %}{% if lim %} · factor limitante: {{ factors.get(lim, lim) }}{% endif %}{% else %}—{% endif %}

        <sub>Los índices (0-100) estiman lo favorables que son las condiciones para la fructificación. **No son probabilidades** ni garantizan que haya setas. Datos meteorológicos de modelos (Open-Meteo), salvo sensores propios.</sub>
  - type: grid
    cards:
    - type: heading
      heading: Urbasa
      icon: mdi:map-marker
    - type: tile
      entity: binary_sensor.mycomonitor_urbasa_favorable_conditions
      name: Condiciones favorables
    - type: custom:mushroom-template-card
      entity: sensor.mycomonitor_urbasa_boletus_edulis
      primary: Boletus (grupo edulis)
      secondary: '{{ states(entity) | float(0) | round(0) }} · {{ state_attr(entity, ''category'') }}'
      icon: mdi:mushroom
      icon_color: '{% set v = states(entity) | float(0) %}{{ ''green'' if v >= 60 else ''amber'' if v
        >= 40 else ''orange'' if v >= 20 else ''grey'' }}'
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.mycomonitor_urbasa_calocybe_gambosa
      primary: Perretxiko (seta de San Jorge)
      secondary: '{{ states(entity) | float(0) | round(0) }} · {{ state_attr(entity, ''category'') }}'
